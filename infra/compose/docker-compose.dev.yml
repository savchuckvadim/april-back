# ============================================================
# Monorepo DEV stack: поднимает ВСЕ приложения монорепо локально.
# Каждое приложение собирается из общего infra/docker/Dockerfile по build-арг APP
# (webpack -> dist/apps/<APP>/main.js). Если у app есть собственный
# infra/docker/<app>/Dockerfile — задайте его в build.dockerfile этого сервиса.
#
# Запуск (из каталога infra/compose):
#   docker compose --env-file ports.env -f docker-compose.dev.yml up -d --build
# Пересборка ОДНОГО приложения (остальные не трогаются):
#   docker compose --env-file ports.env -f docker-compose.dev.yml up -d --no-deps --build admin
# Логи:
#   docker compose -f docker-compose.dev.yml logs -f back
#
# ПОРТЫ: внутри контейнера ВСЕ apps слушают 3000 (изолированы); наружу — host-порты
#        из infra/compose/ports.env (--env-file). Менять порт → только в ports.env.
#
# ENV-СТРАТЕГИЯ:
#   - ../../.env             — ОБЩИЕ переменные (DB, Redis, Bitrix...) для всех apps
#   - ../../apps/<app>/.env  — переменные КОНКРЕТНОГО app (SWAGGER_*, флаги)
#     (required:false — если файла нет, не падаем). environment ниже перекрывает env_file.
# ============================================================

# Ротация stdout-логов контейнеров: без неё json-file растёт бесконечно
# и забивает диск. Максимум 3 файла по 10MB на контейнер.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app-common: &app-common
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    redis:
      condition: service_healthy
    db:
      condition: service_healthy
  networks:
    - app-network
  volumes:
    - ../../keys:/app/keys
    - ../../storage:/app/storage

# Общее окружение всех контейнеров. PORT=3000 одинаков для всех (контейнеры
# изолированы) — поэтому он здесь, а не дублируется в каждом сервисе.
x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  REDIS_HOST: redis
  REDIS_PORT: 6379
  DATABASE_URL: mysql://root:cfdx@db:3306/bitrix
  # Внутри docker-сети ClickHouse доступен по имени сервиса (перекрывает
  # localhost-URL из корневого .env, который нужен для локального nest start).
  CLICKHOUSE_URL: http://clickhouse:8123

# Healthcheck одинаков для всех (порт всегда 3000) — один якорь на всех.
x-healthcheck: &app-healthcheck
  test:
    [
      'CMD',
      'node',
      '-e',
      "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
    ]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 40s

# Шаблон app-сервиса: отличия сервисов — только APP, container_name, env_file и host-порт.
x-app: &app-service
  <<: *app-common
  environment: *app-env
  healthcheck: *app-healthcheck

services:
  # ---------------- Приложения монорепо ----------------
  back:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: back }
    container_name: app-back
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/back/.env
        required: false
    ports: ['${BACK_HOST_PORT}:3000']

  kpi-report-sales:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: kpi-report-sales }
    container_name: app-kpi-report-sales
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/kpi-report-sales/.env
        required: false
    ports: ['${KPI_REPORT_SALES_HOST_PORT}:3000']

  pbx-install:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: pbx-install }
    container_name: app-pbx-install
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/pbx-install/.env
        required: false
    ports: ['${PBX_INSTALL_HOST_PORT}:3000']

  kpi-report-service:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: kpi-report-service }
    container_name: app-kpi-report-service
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/kpi-report-service/.env
        required: false
    ports: ['${KPI_REPORT_SERVICE_HOST_PORT}:3000']

  admin:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: admin }
    container_name: app-admin
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/admin/.env
        required: false
    ports: ['${ADMIN_HOST_PORT}:3000']

  event-sales:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: event-sales }
    container_name: app-event-sales
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/event-sales/.env
        required: false
    ports: ['${EVENT_SALES_HOST_PORT}:3000']

  event-service:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: event-service }
    container_name: app-event-service
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/event-service/.env
        required: false
    ports: ['${EVENT_SERVICE_HOST_PORT}:3000']

  konstructor:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: konstructor }
    container_name: app-konstructor
    # Топология конвертации — здесь, а не в .env: размер пула равен числу
    # реплик gotenberg и меняется одним GOTENBERG_REPLICAS.
    environment:
      <<: *app-env
      LIBREOFFICE_MODE: http
      LIBREOFFICE_HTTP_URL: http://gotenberg:3000
      LIBREOFFICE_DISCOVERY: dns
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/konstructor/.env
        required: false
    ports: ['${KONSTRUCTOR_HOST_PORT}:3000']

  rq:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: rq }
    container_name: app-rq
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/rq/.env
        required: false
    ports: ['${RQ_HOST_PORT}:3000']

  pbx:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: pbx }
    container_name: app-pbx
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/pbx/.env
        required: false
    ports: ['${PBX_HOST_PORT}:3000']

  bot:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: bot }
    container_name: app-bot
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/bot/.env
        required: false
    ports: ['${BOT_HOST_PORT}:3000']

  bitrix-app-client:
    <<: *app-service
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: { APP: bitrix-app-client }
    container_name: app-bitrix-app-client
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/bitrix-app-client/.env
        required: false
    ports: ['${BITRIX_APP_CLIENT_HOST_PORT}:3000']

  # ---------------- Инфраструктура ----------------
  # Redis с персистентностью: AOF (appendfsync everysec) + RDB-снапшоты.
  # Данные лежат в именованном volume redis_data (/data), поэтому переживают
  # перезапуск и полное удаление контейнера. Нужно для pbx-cache (бессрочные
  # общие данные портала между приложениями).
  redis:
    image: redis:7
    container_name: redis
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--save',
        '900 1',
        '--save',
        '300 10',
        '--save',
        '60 10000',
      ]
    ports: ['${REDIS_HOST_PORT}:6379']
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    volumes:
      - redis_data:/data

  # Локальная dev-БД. На проде подключаемся к внешней БД через DATABASE_URL.
  db:
    image: mysql:8.0
    container_name: app_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: cfdx
      MYSQL_DATABASE: bitrix
      MYSQL_PASSWORD: cfdx
    ports: ['${DB_HOST_PORT}:3306']
    volumes:
      - db_data:/var/lib/mysql
      - ../../db_dev:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-pcfdx']
      interval: 5s
      timeout: 3s
      retries: 10

  # Хранилище логов всех приложений (@lib/logger -> ClickHouse, HTTP :8123).
  # Схема (logs.app_logs, TTL 30 дней) создаётся сама при первом старте из
  # infra/clickhouse/init. Креды (CLICKHOUSE_USER/PASSWORD/DB) — из ../../.env
  # (env_file, а не ${}-интерполяция: она видит только ports.env/шелл).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mono-clickhouse
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: ../../.env
        required: true
    ports: ['${CLICKHOUSE_HOST_PORT}:8123']
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Конвертация Office -> PDF (LibreOffice внутри). LibreOffice не умеет
  # параллельные конверсии: одна реплика = один документ за раз, поэтому
  # реплик несколько, а приложение резолвит имя сервиса во все их адреса
  # (LIBREOFFICE_DISCOVERY=dns у konstructor). Подробности и правило выбора
  # числа реплик — в docker-compose.prod.yml над этим же блоком.
  # На dev-машине по умолчанию 2: она слабее прода.
  gotenberg:
    image: gotenberg/gotenberg:8
    deploy:
      replicas: ${GOTENBERG_REPLICAS:-2}
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    command:
      - gotenberg
      - --api-timeout=300s
      - --libreoffice-auto-start=true
      - --libreoffice-restart-after=50
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # Метрики приложений: скрейпит /api/metrics всех apps (@lib/metrics).
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - prometheus_data:/prometheus
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['${PROMETHEUS_HOST_PORT}:9090']
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 5

  # UI наблюдаемости (метрики Prometheus + логи ClickHouse), провижининг —
  # infra/grafana/provisioning; админ-доступ GF_SECURITY_ADMIN_* из ../../.env.
  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: ../../.env
        required: true
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports: ['${GRAFANA_HOST_PORT}:3000']
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  redis_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
