# ============================================================
# Monorepo DEV stack: поднимает ВСЕ приложения монорепо локально.
# Каждое приложение собирается из общего infra/docker/Dockerfile по build-арг APP
# (webpack -> dist/apps/<APP>/main.js). Если у app есть собственный
# infra/docker/<app>/Dockerfile — задайте его в build.dockerfile этого сервиса.
#
# Запуск (из каталога infra/compose):
#   docker compose -f docker-compose.dev.yml up -d --build
# Пересборка ОДНОГО приложения (остальные не трогаются):
#   docker compose -f docker-compose.dev.yml up -d --no-deps --build admin
# Логи:
#   docker compose -f docker-compose.dev.yml logs -f back
#
# ENV-стратегия:
#   - ../../.env             — ОБЩИЕ переменные (DB, Redis, Bitrix...) для всех apps
#   - ../../apps/<app>/.env  — переменные КОНКРЕТНОГО app (PORT, SWAGGER_*, флаги)
#     (required:false — если файла нет, не падаем; PORT всё равно задан в environment)
#   секция environment переопределяет env_file (сетевые имена контейнеров, PORT).
# ============================================================



x-healthcheck: &app-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 40s

# Ротация stdout-логов контейнеров: без неё json-file растёт бесконечно
# и забивает диск. Максимум 3 файла по 10MB на контейнер.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ---------------- Приложения монорепо ----------------
  # ---------------- Инфраструктура ----------------
  redis:
    image: redis:7
    container_name: redis
    ports: ["6379:6379"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  # Локальная dev-БД. На проде подключаемся к внешней БД через DATABASE_URL.
  db:
    image: mysql:8.0
    container_name: app_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: cfdx
      MYSQL_DATABASE: bitrix
      MYSQL_PASSWORD: cfdx
    ports: ["3306:3306"]
    volumes:
      - db_data:/var/lib/mysql
      - ../../db_dev:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcfdx"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Конвертация Office -> PDF (LibreOffice внутри). Приложение запускается
  # ЛОКАЛЬНО -> LIBREOFFICE_HTTP_URL=http://localhost:33030.
  # Локально хватает одного инстанса; в dev/prod их несколько, потому что
  # LibreOffice не умеет параллельные конверсии (см. docker-compose.prod.yml).
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports: ["33030:3000"]
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    # --api-timeout: дефолт 30s, из-за него тяжёлые документы падают с 503.
    command:
      - gotenberg
      - --api-timeout=300s
      - --libreoffice-auto-start=true
      - --libreoffice-restart-after=50

  # Хранилище логов (@lib/logger -> ClickHouse). Схема (logs.app_logs, TTL 30 дней)
  # создаётся сама при первом старте из infra/clickhouse/init.
  # Приложение запускается ЛОКАЛЬНО (nest start) -> в .env для этого сценария
  # CLICKHOUSE_URL=http://localhost:8123 (а не http://clickhouse:8123, как в docker).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: ../../.env
        required: false
    ports: ["8123:8123"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Метрики. Приложения в base-сценарии запущены локально — цели для их
  # скрейпа раскомментируйте в infra/prometheus/prometheus.yml (job apps-local,
  # host.docker.internal). Цели apps-in-docker будут просто down — это ок.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - prometheus_data:/prometheus
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # UI наблюдаемости (метрики Prometheus + логи ClickHouse).
  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: ../../.env
        required: false
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports: ["3010:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
