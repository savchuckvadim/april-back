# ============================================================
# Monorepo PROD stack: запускает приложения из готовых образов GHCR
# (сборка — в GitHub Actions, сервер только pull). Локальной БД нет —
# прод ходит во внешнюю БД через DATABASE_URL из ../../.env.
#
# Переменные интерполяции (берутся из шелл-окружения и/или --env-file):
#   GHCR_OWNER=<github-owner>     # владелец пакетов ghcr.io
#   IMAGE_TAG=latest             # или конкретный <sha> для пиннинга
#   <APP>_HOST_PORT              # host-порты — из infra/compose/ports.env
#
# Деплой одного приложения (остальные не трогаются), из корня репо:
#   docker compose --env-file infra/compose/ports.env \
#     -f infra/compose/docker-compose.prod.yml pull admin
#   docker compose --env-file infra/compose/ports.env \
#     -f infra/compose/docker-compose.prod.yml up -d --no-deps admin
# (GHCR_OWNER/IMAGE_TAG обычно экспортируются в шелле перед командой.)
# ============================================================

# Ротация stdout-логов контейнеров: без неё json-file растёт бесконечно
# и забивает диск. Максимум 3 файла по 10MB на контейнер.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-app-common: &app-common
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - app-network
  volumes:
    - ../../keys:/app/keys
    - ../../storage:/app/storage

# PORT=3000 одинаков для всех контейнеров (изолированы) — не дублируем по сервисам.
x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # Внутри docker-сети ClickHouse доступен по имени сервиса (перекрывает
  # значение из .env, если там URL для локального запуска).
  CLICKHOUSE_URL: http://clickhouse:8123

# Healthcheck одинаков для всех (порт всегда 3000).
x-healthcheck: &app-healthcheck
  test:
    [
      'CMD',
      'node',
      '-e',
      "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
    ]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 40s

x-app: &app-service
  <<: *app-common
  environment: *app-env
  healthcheck: *app-healthcheck

services:
  back:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-back:${IMAGE_TAG:-latest}
    container_name: app-back
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/back/.env
        required: false
    ports: ['${BACK_HOST_PORT}:3000']

  kpi-report-sales:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-kpi-report-sales:${IMAGE_TAG:-latest}
    container_name: app-kpi-report-sales
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/kpi-report-sales/.env
        required: false
    ports: ['${KPI_REPORT_SALES_HOST_PORT}:3000']

  pbx-install:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-pbx-install:${IMAGE_TAG:-latest}
    container_name: app-pbx-install
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/pbx-install/.env
        required: false
    ports: ['${PBX_INSTALL_HOST_PORT}:3000']

  kpi-report-service:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-kpi-report-service:${IMAGE_TAG:-latest}
    container_name: app-kpi-report-service
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/kpi-report-service/.env
        required: false
    ports: ['${KPI_REPORT_SERVICE_HOST_PORT}:3000']

  admin:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-admin:${IMAGE_TAG:-latest}
    container_name: app-admin
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/admin/.env
        required: false
    ports: ['${ADMIN_HOST_PORT}:3000']

  event-sales:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-event-sales:${IMAGE_TAG:-latest}
    container_name: app-event-sales
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/event-sales/.env
        required: false
    ports: ['${EVENT_SALES_HOST_PORT}:3000']

  event-service:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-event-service:${IMAGE_TAG:-latest}
    container_name: app-event-service
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/event-service/.env
        required: false
    ports: ['${EVENT_SERVICE_HOST_PORT}:3000']

  konstructor:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-konstructor:${IMAGE_TAG:-latest}
    container_name: app-konstructor
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/konstructor/.env
        required: false
    ports: ['${KONSTRUCTOR_HOST_PORT}:3000']

  rq:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-rq:${IMAGE_TAG:-latest}
    container_name: app-rq
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/rq/.env
        required: false
    ports: ['${RQ_HOST_PORT}:3000']

  pbx:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-pbx:${IMAGE_TAG:-latest}
    container_name: app-pbx
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/pbx/.env
        required: false
    ports: ['${PBX_HOST_PORT}:3000']

  bot:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-bot:${IMAGE_TAG:-latest}
    container_name: app-bot
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/bot/.env
        required: false
    ports: ['${BOT_HOST_PORT}:3000']

  bitrix-app-client:
    <<: *app-service
    image: ghcr.io/${GHCR_OWNER}/april-bitrix-app-client:${IMAGE_TAG:-latest}
    container_name: app-bitrix-app-client
    env_file:
      - path: ../../.env
        required: true
      - path: ../../apps/bitrix-app-client/.env
        required: false
    ports: ['${BITRIX_APP_CLIENT_HOST_PORT}:3000']

  # ---------------- Инфраструктура ----------------
  # Redis с персистентностью: AOF (appendfsync everysec) + RDB-снапшоты.
  # Данные лежат в именованном volume redis_data (/data) и переживают
  # перезапуск/полное удаление контейнера. Нужно для pbx-cache (бессрочные
  # общие данные портала между приложениями).
  redis:
    image: redis:7
    container_name: mono-redis
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--save',
        '900 1',
        '--save',
        '300 10',
        '--save',
        '60 10000',
      ]
    ports: ['${REDIS_HOST_PORT}:6379']
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    volumes:
      - redis_data:/data

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: mono-gotenberg
    ports: ['${GOTENBERG_HOST_PORT}:3000']
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging

  # Хранилище логов всех приложений (@lib/logger -> ClickHouse, HTTP :8123).
  # Схема (logs.app_logs, TTL 30 дней — старые логи удаляются сами) создаётся
  # при первом старте из infra/clickhouse/init. Порт наружу НЕ публикуется —
  # доступ только изнутри app-network (clickhouse:8123). Креды
  # (CLICKHOUSE_USER/PASSWORD/DB) — из ../../.env (env_file, а не
  # ${}-интерполяция: она видит только ports.env/шелл).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mono-clickhouse
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: ../../.env
        required: true
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Метрики приложений: скрейпит /api/metrics всех apps (@lib/metrics).
  # Порт наружу не публикуется — читает только Grafana по внутренней сети.
  # Ретеншен 30 дней / максимум 2GB — диск не переполняется.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mono-prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - prometheus_data:/prometheus
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 5

  # UI наблюдаемости: datasource'ы (Prometheus — метрики, ClickHouse — логи)
  # заводятся сами из infra/grafana/provisioning. Админ-доступ:
  # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD из ../../.env.
  grafana:
    image: grafana/grafana:11.6.0
    container_name: mono-grafana
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: ../../.env
        required: true
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports: ['${GRAFANA_HOST_PORT}:3000']
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
