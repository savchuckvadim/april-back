# Redis зеркала. Копируется в <files>/redis/redis.conf на сервере зеркала
# (монтируется на запись в контейнер redis, см. docker-compose.mirror.yml).
#
# Фаза 2 (до данных): файл как есть — обычный мастер с персистентностью,
# приложения в режиме ожидания поднимаются на пустом Redis.
# Фаза 3 (данные): раскомментируйте блок «Репликация» — Redis становится
# репликой прода через WireGuard, только для чтения.
# Повышение (runbook): REPLICAOF NO ONE + CONFIG REWRITE — скрипт
# infra/mirror/scripts/promote.sh сам уберёт replicaof из этого файла.

bind 0.0.0.0
protected-mode no
port 6379
dir /data

# Персистентность как на проде: AOF каждую секунду + RDB-снапшоты.
# Обязательно с обеих сторон репликации — пустой мастер после авторестарта
# обнулил бы и реплику.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# ---- Репликация (фаза 3) ----
# replicaof 10.10.0.1 6379
# masterauth <пароль Redis прода, если на проде включён requirepass>
# replica-read-only yes
# replica-serve-stale-data yes
# Если на проде Redis опубликован Docker-ом на хост-порт (REDIS_HOST_PORT),
# адрес мастера — IP WireGuard прода и этот хост-порт, например 10.10.0.1 6334.
