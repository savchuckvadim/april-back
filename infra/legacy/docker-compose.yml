services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-api
    ports:
      - "8334:3000"
    env_file:
        - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000                       # для app.listen
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src:/app/src      # 🔁 Монтируем исходники
      - ./tsconfig.json:/app/tsconfig.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./keys:/app/keys
      - ./storage:/app/storage
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6334:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - "33030:3000"
    networks:
      - app-network
    restart: unless-stopped

  # Loki/Promtail/Grafana-стек удалён: логи теперь пишутся в ClickHouse
  # (@lib/logger + сервис clickhouse в infra/compose/docker-compose.*.yml).

networks:
  app-network:
    driver: bridge


