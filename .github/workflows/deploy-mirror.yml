name: Deploy mirror (Dokploy, ветка mirror)

# Зеркало (тёплый резерв) на Dokploy у второго хостера. Прод-workflow
# deploy-monorepo.yml не трогаем — это отдельный конвейер:
#  - detect: изменённые приложения (как на проде; shared → все);
#  - build:  если для этого коммита прод уже собрал образ :<sha> — только
#            перетегировать его в :mirror (те же байты, что на проде);
#            иначе собрать и запушить под тегами :mirror и :mirror-<sha>;
#  - deploy: POST /api/compose.deploy в Dokploy (x-api-key) и, если заданы
#            MIRROR_HEALTH_URLS, дождаться health на тестовых доменах.
# Ветка mirror = копия monorepo после удачного прод-деплоя
# (git push origin monorepo:mirror); Auto Deploy в Dokploy выключен —
# деплой идёт отсюда, когда образы уже в GHCR. Runbook: infra/mirror/README.md.
#
# Секреты репо: DOKPLOY_URL (https://панель), DOKPLOY_API_KEY,
# DOKPLOY_COMPOSE_ID. Переменная (vars) MIRROR_HEALTH_URLS — URL health
# через пробел, необязательно.

on:
    push:
        branches:
            - mirror
    workflow_dispatch:
        inputs:
            apps:
                description: 'Что собрать: "all", "none" (только redeploy стека) или список через пробел/запятую (напр. "admin pbx").'
                required: false
                default: 'all'

permissions:
    contents: read
    packages: write

concurrency:
    group: deploy-mirror
    cancel-in-progress: false

env:
    IMAGE_TAG: mirror

jobs:
    # ---------------------------------------------------------------
    detect:
        runs-on: ubuntu-latest
        outputs:
            apps: ${{ steps.set.outputs.apps }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      shared:
                        - 'libs/**'
                        - 'package*.json'
                        - 'prisma/**'
                        - 'tsconfig*.json'
                        - 'nest-cli.json'
                        - 'infra/docker/**'
                        - '.dockerignore'
                      back: ['apps/back/**']
                      kpi-report-sales: ['apps/kpi-report-sales/**']
                      pbx-install: ['apps/pbx-install/**']
                      kpi-report-service: ['apps/kpi-report-service/**']
                      admin: ['apps/admin/**']
                      event-sales: ['apps/event-sales/**']
                      event-service: ['apps/event-service/**']
                      konstructor: ['apps/konstructor/**']
                      rq: ['apps/rq/**']
                      pbx: ['apps/pbx/**']
                      bot: ['apps/bot/**']
                      bitrix-app-client: ['apps/bitrix-app-client/**']

            - name: Вычислить список приложений
              id: set
              env:
                  MANUAL_APPS: ${{ github.event.inputs.apps }}
              run: |
                  ALL='["back","kpi-report-sales","pbx-install","kpi-report-service","admin","event-sales","event-service","konstructor","rq","pbx","bot","bitrix-app-client"]'
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    if [ -z "$MANUAL_APPS" ] || [ "$MANUAL_APPS" = "all" ]; then
                      echo "apps=$ALL" >> "$GITHUB_OUTPUT"
                    elif [ "$MANUAL_APPS" = "none" ]; then
                      echo "apps=[]" >> "$GITHUB_OUTPUT"
                    else
                      ARR=$(echo "$MANUAL_APPS" | tr ', ' '\n' | sed '/^$/d' | sed 's/.*/"&"/' | paste -sd, -)
                      echo "apps=[$ARR]" >> "$GITHUB_OUTPUT"
                    fi
                  elif [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
                    echo "apps=$ALL" >> "$GITHUB_OUTPUT"
                  else
                    echo "apps=${{ steps.filter.outputs.changes }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Показать решение detect
              run: echo "apps=${{ steps.set.outputs.apps }}"

    # ---------------------------------------------------------------
    build:
        needs: detect
        if: needs.detect.outputs.apps != '[]'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                app: ${{ fromJSON(needs.detect.outputs.apps) }}
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Owner в нижнем регистре
              id: owner
              run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

            # Прод-деплой (deploy-monorepo.yml) пушит образы с тегом :<sha>.
            # Если ветка mirror указывает на тот же коммит — переиспользуем
            # ровно тот же образ, что крутится на проде.
            - name: Переиспользовать прод-образ :<sha>, если он есть
              id: reuse
              env:
                  IMAGE: ghcr.io/${{ steps.owner.outputs.owner }}/april-${{ matrix.app }}
              run: |
                  if docker manifest inspect "$IMAGE:${{ github.sha }}" >/dev/null 2>&1; then
                    echo "♻️ Найден $IMAGE:${{ github.sha }} — перетегирую в :$IMAGE_TAG"
                    docker buildx imagetools create \
                      -t "$IMAGE:$IMAGE_TAG" \
                      -t "$IMAGE:$IMAGE_TAG-${{ github.sha }}" \
                      "$IMAGE:${{ github.sha }}"
                    echo "reused=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "🔨 Образа для ${{ github.sha }} нет — собираю"
                    echo "reused=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Выбрать Dockerfile (override или общий)
              if: steps.reuse.outputs.reused != 'true'
              id: df
              run: |
                  f="infra/docker/${{ matrix.app }}/Dockerfile"
                  [ -f "$f" ] || f="infra/docker/Dockerfile"
                  echo "file=$f" >> "$GITHUB_OUTPUT"

            - name: Build & push ${{ matrix.app }}
              if: steps.reuse.outputs.reused != 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ steps.df.outputs.file }}
                  build-args: APP=${{ matrix.app }}
                  push: true
                  tags: |
                      ghcr.io/${{ steps.owner.outputs.owner }}/april-${{ matrix.app }}:${{ env.IMAGE_TAG }}
                      ghcr.io/${{ steps.owner.outputs.owner }}/april-${{ matrix.app }}:${{ env.IMAGE_TAG }}-${{ github.sha }}
                  # Читаем кэш прода (общие слои npm ci), пишем в свой — прод-кэш не трогаем.
                  cache-from: |
                      type=registry,ref=ghcr.io/${{ steps.owner.outputs.owner }}/april-${{ matrix.app }}:buildcache
                      type=registry,ref=ghcr.io/${{ steps.owner.outputs.owner }}/april-${{ matrix.app }}:buildcache-mirror
                  cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.owner }}/april-${{ matrix.app }}:buildcache-mirror,mode=max

    # ---------------------------------------------------------------
    deploy:
        needs: [detect, build]
        # Деплоим и когда build пропущен (apps=[]: менялся только compose/README).
        if: always() && needs.detect.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
        runs-on: ubuntu-latest
        steps:
            - name: Запустить деплой compose-стека в Dokploy
              env:
                  DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
                  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
                  DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
              run: |
                  set -e
                  : "${DOKPLOY_URL:?secret DOKPLOY_URL не задан}" "${DOKPLOY_API_KEY:?secret DOKPLOY_API_KEY не задан}" "${DOKPLOY_COMPOSE_ID:?secret DOKPLOY_COMPOSE_ID не задан}"
                  curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
                    -H "x-api-key: ${DOKPLOY_API_KEY}" \
                    -H 'Content-Type: application/json' \
                    -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\"}"
                  echo
                  echo "🚀 Деплой зеркала поставлен в очередь Dokploy (tag=$IMAGE_TAG, sha=${{ github.sha }})"

            - name: Дождаться health на тестовых доменах (если заданы)
              if: vars.MIRROR_HEALTH_URLS != ''
              env:
                  URLS: ${{ vars.MIRROR_HEALTH_URLS }}
              run: |
                  # Dokploy сначала клонирует репо и тянет образы — даём до 15 минут.
                  timeout=900; elapsed=0
                  for url in $URLS; do
                    echo "⌛ $url"
                    until code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url") && [ "$code" = "200" ]; do
                      if [ "$elapsed" -ge "$timeout" ]; then
                        echo "❌ $url не ответил 200 за ${timeout}s (последний код: $code)"; exit 1
                      fi
                      sleep 15; elapsed=$((elapsed + 15))
                    done
                    echo "✅ $url"
                  done
