name: Deploy mirror (Dokploy, после прод-деплоя)

# Зеркало (тёплый резерв) на Dokploy у второго хостера. Прод-workflow
# deploy-monorepo.yml не трогаем — этот конвейер идёт следом за ним:
#  - wait-prod: на push в monorepo ждёт, пока прод-деплой ЭТОГО ЖЕ коммита
#               закончится. Прод упал — зеркало не трогаем (на нём остаётся
#               последняя рабочая версия);
#  - retag:     зеркало крутит ровно прод-образы. Для каждого приложения:
#               есть :<sha> (прод только что собрал) — он; тега :mirror ещё
#               нет (первый запуск) — :latest; иначе приложение не менялось.
#               Прошлый :mirror сохраняется как :mirror-prev (откат);
#  - deploy:    POST /api/compose.deploy в Dokploy (x-api-key) и, если заданы
#               MIRROR_HEALTH_URLS, ожидание health.
# Сборки здесь нет: на зеркало попадает только то, что прошло прод.
# workflow_run не используем — он срабатывает лишь для файла в ветке по
# умолчанию (main), а push в main запускает старый deploy.yml.
#
# Ручной запуск (Actions → Run workflow):
#  - sync=changed — как на push (по образам :<sha> выбранного коммита);
#  - sync=latest  — выровнять зеркало по текущему проду (все :latest);
#  - sync=none    — только redeploy стека (поменяли env/домены в Dokploy).
#
# Секреты репо: DOKPLOY_URL (https://домен панели), DOKPLOY_API_KEY,
# DOKPLOY_COMPOSE_ID. Переменная (vars) MIRROR_HEALTH_URLS — URL health
# через пробел, необязательно. Runbook: infra/mirror/README.md.

on:
    push:
        branches:
            - monorepo # та же ветка, что у прода; Dokploy тоже смотрит в неё
    workflow_dispatch:
        inputs:
            sync:
                description: 'changed — образы этого коммита; latest — выровнять по текущему проду; none — только redeploy'
                required: false
                default: 'changed'
                type: choice
                options: [changed, latest, none]

permissions:
    contents: read
    actions: read # статус прод-workflow
    packages: write # перетегирование образов в ghcr.io

concurrency:
    group: deploy-mirror
    cancel-in-progress: false

env:
    MIRROR_TAG: mirror
    PROD_WORKFLOW: deploy-monorepo.yml
    APPS: back kpi-report-sales pbx-install kpi-report-service admin event-sales event-service konstructor rq pbx bot bitrix-app-client

jobs:
    # ---------------------------------------------------------------
    wait-prod:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 110
        steps:
            - name: Дождаться прод-деплоя коммита ${{ github.sha }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  api="repos/${{ github.repository }}/actions/workflows/$PROD_WORKFLOW/runs?head_sha=${{ github.sha }}&event=push&per_page=1"
                  started=$(date +%s)
                  while true; do
                    run=$(gh api "$api" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
                    elapsed=$(( $(date +%s) - started ))
                    if [ -z "$run" ]; then
                      if [ "$elapsed" -ge 300 ]; then
                        echo "❌ Прод-workflow для ${{ github.sha }} так и не запустился за 5 минут"; exit 1
                      fi
                      echo "⌛ прод-workflow ещё не появился (${elapsed}s)"
                    else
                      read -r status conclusion url <<<"$run"
                      if [ "$status" = "completed" ]; then
                        echo "Прод: $conclusion — $url"
                        if [ "$conclusion" = "success" ]; then exit 0; fi
                        echo "❌ Прод-деплой не успешен — зеркало остаётся на прошлой версии"; exit 1
                      fi
                      echo "⌛ прод: $status (${elapsed}s) — $url"
                    fi
                    sleep 30
                  done

    # ---------------------------------------------------------------
    retag:
        needs: wait-prod
        # На ручном запуске wait-prod пропущен — retag идёт сразу.
        if: always() && (needs.wait-prod.result == 'success' || needs.wait-prod.result == 'skipped') && github.event.inputs.sync != 'none'
        runs-on: ubuntu-latest
        steps:
            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Перетегировать прод-образы в :${{ env.MIRROR_TAG }}
              env:
                  SYNC: ${{ github.event.inputs.sync || 'changed' }}
              run: |
                  set -e
                  owner="${GITHUB_REPOSITORY_OWNER,,}"
                  exists () { docker buildx imagetools inspect "$1" >/dev/null 2>&1; }
                  for app in $APPS; do
                    img="ghcr.io/$owner/april-$app"
                    if [ "$SYNC" = "latest" ]; then
                      src="$img:latest"
                    elif exists "$img:${{ github.sha }}"; then
                      src="$img:${{ github.sha }}"
                    elif ! exists "$img:$MIRROR_TAG"; then
                      src="$img:latest"   # первый запуск: зеркало = текущий прод
                    else
                      echo "= $app: не менялся в этом коммите"
                      continue
                    fi
                    if exists "$img:$MIRROR_TAG"; then
                      docker buildx imagetools create -t "$img:$MIRROR_TAG-prev" "$img:$MIRROR_TAG"
                    fi
                    docker buildx imagetools create -t "$img:$MIRROR_TAG" "$src"
                    echo "♻️ $app: $src → :$MIRROR_TAG"
                  done

    # ---------------------------------------------------------------
    deploy:
        needs: [wait-prod, retag]
        if: always() && (needs.wait-prod.result == 'success' || needs.wait-prod.result == 'skipped') && (needs.retag.result == 'success' || needs.retag.result == 'skipped')
        runs-on: ubuntu-latest
        steps:
            - name: Запустить деплой compose-стека в Dokploy
              env:
                  DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
                  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
                  DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
              run: |
                  set -e
                  : "${DOKPLOY_URL:?secret DOKPLOY_URL не задан}" "${DOKPLOY_API_KEY:?secret DOKPLOY_API_KEY не задан}" "${DOKPLOY_COMPOSE_ID:?secret DOKPLOY_COMPOSE_ID не задан}"
                  curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
                    -H "x-api-key: ${DOKPLOY_API_KEY}" \
                    -H 'Content-Type: application/json' \
                    -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\",\"title\":\"CI ${GITHUB_SHA::7}\"}"
                  echo
                  echo "🚀 Деплой зеркала поставлен в очередь Dokploy (sha=${{ github.sha }})"

            - name: Дождаться health (если заданы MIRROR_HEALTH_URLS)
              if: vars.MIRROR_HEALTH_URLS != ''
              env:
                  URLS: ${{ vars.MIRROR_HEALTH_URLS }}
              run: |
                  # Dokploy клонирует репо и тянет образы — даём до 15 минут.
                  timeout=900; elapsed=0
                  for url in $URLS; do
                    echo "⌛ $url"
                    until code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url") && [ "$code" = "200" ]; do
                      if [ "$elapsed" -ge "$timeout" ]; then
                        echo "❌ $url не ответил 200 за ${timeout}s (последний код: $code)"; exit 1
                      fi
                      sleep 15; elapsed=$((elapsed + 15))
                    done
                    echo "✅ $url"
                  done
